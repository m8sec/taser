[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taser"
version = "0.5.0"
description = "Security resource and abstraction library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "m8sec" }]
dependencies = [
    "beautifulsoup4",
    "cryptography",
    "dnspython",
    "ipparser>=1.0.0",
    "lxml",
    "ntlm-auth",
    "requests",
    "requests-file",
    "requests-ntlm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
]

[project.optional-dependencies]
browser = ["selenium"]
exp = ["pyopenssl", "scapy"]

[project.urls]
Homepage = "https://github.com/m8sec/taser"

[tool.setuptools.packages.find]
include = ["taser", "taser.*"]
